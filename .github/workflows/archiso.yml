name: Build BlackArch ISO Stable
on:
  workflow_dispatch:
  #schedule:
  #   - cron:  '0 0 */7 * *'

permissions:
  contents: read

env:
  ID: 'blackarch-linux'
  ISO_ARCHITECTURE: 'x86_64'

jobs:
  Init:
    runs-on: ubuntu-latest
    outputs:
      iso_version: ${{ steps.version.outputs.iso_version }}
    steps:
      - name: Compute ISO version
        id: version
        run: echo "iso_version=$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

  Build:
    needs: Init
    env:
      ISO_VERSION: ${{ needs.Init.outputs.iso_version }}
    runs-on: ubuntu-latest
    container:
      image: blackarchlinux/blackarch:latest
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        variant: [netinstall, slim]
    steps:
      - name: Checkout files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Init Keys
        run: |
          rm -rf /etc/pacman.d/gnupg
          pacman-key --init
          pacman-key --populate
          pacman -Syy

      - name: Install rate-mirrors
        run: pacman -Syyu --noconfirm rate-mirrors

      - name: Set fastest mirrors
        run: |
          rate-mirrors --concurrency 40 --disable-comments --allow-root --save /etc/pacman.d/mirrorlist arch || true
          rate-mirrors --concurrency 40 --disable-comments --allow-root --save /etc/pacman.d/blackarch-mirrorlist blackarch

      - name: Install dependencies
        run: pacman -Syyu --noconfirm sudo archiso aws-cli curl edk2-ovmf git github-cli gnupg jq mtools qemu-desktop rsync sshpass wget # Install also optional deps for archiso

      - name: Build ArchISO
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          cd tools
          ./build-iso.sh

      - name: Collect the ISO and checksums
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          ISO="$HOME/${ID}-out/${ID}-${VARIANT}-${ISO_VERSION}-${ISO_ARCHITECTURE}.iso"
          ls -la "$ISO" "$ISO".{md5,sha1,sha256,sha512}
          # relative path on purpose: ${{ github.workspace }} is the host path in container jobs
          mkdir -p out
          mv "$ISO" "$ISO".{md5,sha1,sha256,sha512} out/

      - uses: actions/upload-artifact@v7
        with:
          name: iso-${{ matrix.variant }}
          path: out/
          retention-days: 1          # only needed until the upload job has run
          compression-level: 0       # ISOs are already compressed
          if-no-files-found: error

  Upload:
    needs: [Init, Build]
    # still upload the variant that built if the other one failed
    if: ${{ !cancelled() && needs.Init.result == 'success' }}
    runs-on: ubuntu-latest
    environment: mirror
    timeout-minutes: 60
    env:
      ISO_VERSION: ${{ needs.Init.outputs.iso_version }}
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true      # no artifact at all when both builds failed
        with:
          pattern: iso-*
          path: out
          merge-multiple: true

      - name: Upload to BlackArch Mirror
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_KNOWN_HOSTS: ${{ secrets.MIRROR_KNOWN_HOSTS }}
          MIRROR_USER: ${{ secrets.MIRROR_USER }}
        run: |
          shopt -s nullglob
          # only the files we expect, nothing else that may be in the artifacts
          files=()
          for v in netinstall slim; do
            iso="out/${ID}-${v}-${ISO_VERSION}-${ISO_ARCHITECTURE}.iso"
            [ -f "$iso" ] || { echo "::warning::no ISO for variant $v"; continue; }
            files+=("$iso" "$iso".{md5,sha1,sha256,sha512})
          done
          (( ${#files[@]} )) || { echo "::error::no ISO was built"; exit 1; }
          ls -la "${files[@]}"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$MIRROR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          rsync -avz --partial \
            -e "ssh -p 22 -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            "${files[@]}" \
            "$MIRROR_USER@blackarch.org:"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
