# Values substituted into the @PLACEHOLDER@s of the *.in templates in
# layers/base (profiledef.sh, boot menus, /etc/dev-rel).
# Read by tools/merge-profile.sh; this file is NOT copied into the ISO.

VARIANT_ID="full"             # lowercase id, shown in the BIOS menu title
VARIANT_NAME="Full"           # display name, e.g. "BlackArch Linux Full ISO"
ISO_NAME="blackarch-linux-full"   # profiledef.sh iso_name
VARIANT_PURPOSE="perform live usage"   # "...install BlackArch Linux or <this>."

# Extra profiledef.sh file_permissions entries, one per line (may be empty)
FILE_PERMISSIONS='
  ["/etc/skel/scripts/tuning.sh"]="0:0:755"
  ["/etc/skel/scripts/sysclean.sh"]="0:0:755"
'
