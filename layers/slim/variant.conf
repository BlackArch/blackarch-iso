# Values substituted into the @PLACEHOLDER@s of the *.in templates in
# layers/base (profiledef.sh, boot menus, /etc/dev-rel).
# Read by tools/merge-profile.sh; this file is NOT copied into the ISO.

VARIANT_ID="slim"             # lowercase id, shown in the BIOS menu title
VARIANT_NAME="Slim"           # display name, e.g. "BlackArch Linux Slim ISO"
ISO_NAME="blackarch-linux-slim"   # profiledef.sh iso_name
VARIANT_PURPOSE="perform live usage"   # "...install BlackArch Linux or <this>."

# Extra profiledef.sh file_permissions entries, one per line (may be empty)
FILE_PERMISSIONS='
  ["/root"]="0:0:700"
  ["/etc/polkit-1/rules.d"]="0:0:750"
  ["/etc/sudoers.d"]="0:0:750"
  ["/usr/local/bin/blackarch-set-wallpaper"]="0:0:755"
  ["/usr/share/backgrounds/blackarch"]="0:0:755"
  ["/usr/share/backgrounds/blackarch/hacktheplanet.png"]="0:0:644"
'
